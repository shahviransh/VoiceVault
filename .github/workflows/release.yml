name: Build VoiceVault installers

on:
  workflow_dispatch:
  push:

jobs:
  publish:
    # A normal push is ignored. The build runs for a manual start, a v* tag,
    # or any commit whose message contains release:app.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message || '', 'release:app')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          - platform: windows-latest
            args: --bundles nsis,msi

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            build-essential \
            cmake \
            clang \
            pkg-config \
            libssl-dev \
            libdbus-1-dev \
            libfuse2 \
            file

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "VoiceVault ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          releaseBody: |
            Offline interview prep and speaking / writing practice studio.

            **Installers** for Windows (NSIS + MSI), Linux (deb + AppImage), and macOS (Apple Silicon + Intel).

            ### What’s included
            - Native Rust local RAG (`rusqlite` + `sqlite-vec` + FTS5)
            - On-device embeddings via `fastembed` (AllMiniLML6V2)
            - Speaking studio, writing drills, proof-point mode, and calibrated scorecards
            - Local AI providers: Ollama, LM Studio, plus optional Jev / BYOK cloud scoring

            ### Notes
            - These builds are **not code-signed**. Windows SmartScreen and macOS Gatekeeper may ask you to confirm the app before it opens.
            - On first launch, VoiceVault downloads the embedding model into the app data directory and creates `voicevault.db`.
            - Pair with MindVault (to block external AI sites) and career-ops prep Markdown for best results.
          releaseDraft: false
          prerelease: false
          uploadWorkflowArtifacts: true
          args: ${{ matrix.args }}
