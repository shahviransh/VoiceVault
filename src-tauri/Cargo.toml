[package]
name = "voicevault"
version = "0.1.0"
description = "Distraction-free offline interview prep and speaking practice studio"
authors = ["VoiceVault"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "voicevault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
fastembed = "4"
pdf-extract = "0.7"
pulldown-cmark = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
walkdir = "2"
regex = "1"
once_cell = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
